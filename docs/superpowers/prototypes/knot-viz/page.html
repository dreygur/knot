<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>knot · code graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #07090f;
    --ink-2: #0d111b;
    --panel: #10141f;
    --line: #1f2636;
    --line-2: #2a3349;
    --text: #e8ebf4;
    --text-2: #a3abc2;
    --text-3: #7a839c;
    --caller: #5ad1e6;
    --callee: #f2b866;
    --focus: #8fa8ff;
    --shadow: 0 12px 32px -12px rgb(0 0 0 / .6), 0 2px 6px -2px rgb(0 0 0 / .5);
    --sans: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", monospace;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --ink: #f4f2ed;
    --ink-2: #ebe8e1;
    --panel: #fbfaf7;
    --line: #dcd8cf;
    --line-2: #c9c4b8;
    --text: #1b1d24;
    --text-2: #4a4f5e;
    --text-3: #676c7a;
    --caller: #0a7f95;
    --callee: #a8620a;
    --focus: #3550d6;
    --shadow: 0 12px 32px -14px rgb(40 30 10 / .25), 0 2px 6px -2px rgb(40 30 10 / .12);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  ::selection { background: color-mix(in oklab, var(--focus) 35%, transparent); color: var(--text); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  code, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  #stage { position: fixed; inset: 0; background:
      radial-gradient(1200px 800px at 45% 40%, var(--ink-2), var(--ink) 70%); }
  #regions { position: fixed; inset: 0; pointer-events: none; }
  .region { position: absolute; transform: translate(-50%, -50%); font: 600 13px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); white-space: nowrap; transition: opacity .3s; }
  .region b { font-weight: 600; color: var(--text-2); }

  /* top bar */
  .top { position: fixed; top: 16px; left: 16px; right: 16px; display: flex; align-items: center; gap: 12px; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .mark { display: flex; align-items: baseline; gap: 10px; padding: 8px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
  .mark strong { font: 600 15px/1 var(--sans); letter-spacing: -.01em; }
  .mark span { color: var(--text-3); font-size: 13px; }
  .mark .mono { color: var(--text-2); }
  .search { flex: 0 1 420px; margin-left: auto; margin-right: auto; display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 40px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); color: var(--text-3); }
  .search:focus-within { border-color: var(--line-2); }
  .search input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: 0; color: var(--text); font: 14px var(--sans); }
  .search input::placeholder { color: var(--text-3); }
  kbd { font: 500 12px/1 var(--mono); color: var(--text-3); padding: 4px 6px; border: 1px solid var(--line-2); border-radius: 5px; }
  .theme { width: 40px; height: 40px; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); color: var(--text-2); }
  .theme:hover { color: var(--text); border-color: var(--line-2); }

  .results { position: absolute; top: 46px; left: 0; right: 0; max-height: 360px; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; display: none; }
  .results.open { display: block; }
  .res { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 7px; }
  .res[aria-selected="true"], .res:hover { background: var(--ink-2); }
  .res .n { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .res .p { font: 12px var(--mono); color: var(--text-3); white-space: nowrap; }
  .empty { padding: 14px 10px; color: var(--text-3); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }

  /* legend */
  .legend { position: fixed; left: 16px; bottom: 16px; width: 248px; max-height: calc(100vh - 120px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 12px 8px 8px; }
  .legend h2 { margin: 0 8px 8px; font: 600 13px/1.2 var(--sans); color: var(--text-2); display: flex; justify-content: space-between; }
  .legend h2 span { font: 400 12px var(--mono); color: var(--text-3); }
  .chip { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border-radius: 7px; text-align: left; font-size: 13px; color: var(--text); }
  .chip:hover { background: var(--ink-2); }
  .chip .c { font: 12px var(--mono); color: var(--text-3); }
  .chip[aria-pressed="false"] { color: var(--text-3); }
  .chip[aria-pressed="false"] .dot { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--line-2); }
  .toggle { margin: 8px 8px 2px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-2); }
  .switch { width: 32px; height: 18px; border-radius: 9px; background: var(--line-2); position: relative; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--text); transition: transform .25s cubic-bezier(.2,.8,.2,1); }
  .switch[aria-checked="true"] { background: var(--focus); }
  .switch[aria-checked="true"]::after { transform: translateX(14px); }

  /* zoom */
  .zoom { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; transition: right .45s cubic-bezier(.16,1,.3,1); }
  .zoom button { width: 40px; height: 40px; display: grid; place-items: center; color: var(--text-2); }
  .zoom button + button { border-top: 1px solid var(--line); }
  .zoom button:hover { color: var(--text); background: var(--ink-2); }
  body.inspecting .zoom { right: 392px; }

  /* inspector */
  .inspector { position: fixed; top: 72px; right: 16px; bottom: 16px; width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; transform: translateX(calc(100% + 24px)); transition: transform .45s cubic-bezier(.16,1,.3,1); }
  body.inspecting .inspector { transform: none; }
  .ins-head { padding: 18px 18px 14px; border-bottom: 1px solid var(--line); position: relative; }
  .ins-close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--text-3); }
  .ins-close:hover { color: var(--text); background: var(--ink-2); }
  .kind { display: inline-flex; align-items: center; gap: 8px; font: 500 12px var(--mono); color: var(--text-2); }
  .ins-name { margin: 10px 40px 6px 0; font: 600 22px/1.15 var(--sans); letter-spacing: -.02em; overflow-wrap: anywhere; }
  .ins-path { font: 13px var(--mono); color: var(--text-2); overflow-wrap: anywhere; }
  .ins-body { overflow: auto; padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 20px; }
  .sig { margin: 0; padding: 12px; background: var(--ink-2); border: 1px solid var(--line); border-radius: 8px; font: 12.5px/1.55 var(--mono); color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 8px; }
  .stat { padding: 10px 12px; }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat .v { font: 500 18px/1.1 var(--mono); }
  .stat .k { font-size: 12px; color: var(--text-3); margin-top: 3px; }
  .stat.callers .v { color: var(--caller); }
  .stat.callees .v { color: var(--callee); }
  .sec h2 { margin: 0 0 6px; font: 600 13px var(--sans); color: var(--text-2); display: flex; align-items: center; gap: 8px; }
  .sec h2 i { width: 14px; height: 2px; border-radius: 1px; }
  .link { display: grid; grid-template-columns: 10px 1fr; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; margin: 0 -8px; border-radius: 7px; text-align: left; }
  .link:hover { background: var(--ink-2); }
  .link .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
  .link .n small { font: 12px var(--mono); color: var(--text-3); margin-left: 6px; }
  .none { color: var(--text-3); font-size: 13px; }
  .note { padding: 12px; border: 1px dashed var(--line-2); border-radius: 8px; color: var(--text-2); font-size: 13px; }
  .note code { display: block; margin-top: 8px; font-size: 12px; color: var(--text); overflow-wrap: anywhere; }

  .hint { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); font-size: 12.5px; color: var(--text-3); display: flex; gap: 14px; white-space: nowrap; transition: opacity .3s; }
  body.inspecting .hint { opacity: 0; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 10px; border: 3px solid var(--panel); }
  ::-webkit-scrollbar-track { background: transparent; }
  * { scrollbar-color: var(--line-2) transparent; scrollbar-width: thin; }

  @media (max-width: 760px) {
    .mark span { display: none; }
    .legend { display: none; }
    .inspector { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 62vh; transform: translateY(calc(100% + 24px)); }
    body.inspecting .zoom { right: 16px; bottom: calc(62vh + 20px); }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: 0s !important; } }
</style>
</head>
<body>
<div id="stage"></div>
<div id="regions" aria-hidden="true"></div>

<header class="top">
  <div class="mark"><strong>knot</strong><span>compare</span><span class="mono" id="counts"></span></div>
  <div class="search" role="combobox" aria-expanded="false" aria-haspopup="listbox" style="position:relative">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="7" cy="7" r="4.6"/><path d="m10.5 10.5 3.5 3.5" stroke-linecap="round"/></svg>
    <input id="q" type="text" placeholder="Find a symbol or file" autocomplete="off" spellcheck="false" aria-controls="results" aria-label="Find a symbol or file">
    <kbd>/</kbd>
    <div class="results" id="results" role="listbox"></div>
  </div>
  <button class="theme" id="theme" aria-label="Switch light or dark">
    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="9" cy="9" r="3.4"/><path d="M9 1.8v1.6M9 14.6v1.6M1.8 9h1.6M14.6 9h1.6M3.9 3.9l1.1 1.1M13 13l1.1 1.1M3.9 14.1 5 13M13 5l1.1-1.1" stroke-linecap="round"/></svg>
  </button>
</header>

<nav class="legend" aria-label="Folders">
  <h2>Folders <span id="fcount"></span></h2>
  <div id="chips"></div>
  <div class="toggle"><span>Show unconnected (<span class="mono" id="isoN"></span>)</span><button class="switch" id="iso" role="switch" aria-checked="false" aria-label="Show unconnected symbols"></button></div>
</nav>

<div class="zoom">
  <button id="zin" aria-label="Zoom in"><svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg></button>
  <button id="zout" aria-label="Zoom out"><svg width="16" height="16" viewBox="0 0 16 16" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 8h10"/></svg></button>
  <button id="zfit" aria-label="Fit everything"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>
</div>

<aside class="inspector" id="ins" aria-label="Symbol details" aria-hidden="true">
  <div class="ins-head">
    <button class="ins-close" id="close" aria-label="Close details"><svg width="14" height="14" viewBox="0 0 14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m3 3 8 8M11 3l-8 8"/></svg></button>
    <div class="kind" id="iKind"></div>
    <h1 class="ins-name" id="iName"></h1>
    <div class="ins-path" id="iPath"></div>
  </div>
  <div class="ins-body">
    <pre class="sig" id="iSig"></pre>
    <div class="stats">
      <div class="stat"><div class="v" id="iRank"></div><div class="k">rank by reach</div></div>
      <div class="stat callers"><div class="v" id="iInN"></div><div class="k">callers</div></div>
      <div class="stat callees"><div class="v" id="iOutN"></div><div class="k">calls</div></div>
    </div>
    <div class="sec"><h2><i style="background:var(--caller)"></i>Called by</h2><div id="iIn"></div></div>
    <div class="sec"><h2><i style="background:var(--callee)"></i>Calls</h2><div id="iOut"></div></div>
    <div class="sec"><h2>Learnings</h2><div id="iLearn"></div></div>
  </div>
</aside>

<div class="hint"><span><kbd>/</kbd> search</span><span>click a symbol to see who calls it</span><span><kbd>esc</kbd> clear</span></div>

<script src="https://cdn.jsdelivr.net/npm/graphology@0.25.4/dist/graphology.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sigma@3.0.2/dist/sigma.min.js"></script>
<script>
const DATA = __DATA__;
const $ = (id) => document.getElementById(id);
const fmt = new Intl.NumberFormat("en");

// Folder hues: evenly spaced, perceptually even lightness, re-derived per theme.
const HUES = DATA.folders.map((_, i) => (i * 137.508 + 200) % 360);
let theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
const folderColor = (fo) => theme === "dark" ? `oklch(${fo % 2 ? 0.7 : 0.82} 0.13 ${HUES[fo]})` : `oklch(${fo % 2 ? 0.5 : 0.6} 0.15 ${HUES[fo]})`;
// WebGL needs plain RGB, so paint each CSS colour once and read the pixel back.
const toHex = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 1;
  const x = c.getContext("2d", { willReadFrequently: true });
  return (css) => { x.clearRect(0, 0, 1, 1); x.fillStyle = css; x.fillRect(0, 0, 1, 1); const [r, g, b] = x.getImageData(0, 0, 1, 1).data; return "#" + [r, g, b].map((v) => v.toString(16).padStart(2, "0")).join(""); };
})();
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
let palette;
function buildPalette() {
  palette = { folders: DATA.folders.map((_, i) => toHex(folderColor(i))), edge: theme === "dark" ? "#2a3349" : "#cfc9bc", faded: theme === "dark" ? "#111623" : "#e6e2da", caller: toHex(css("--caller")), callee: toHex(css("--callee")), text: toHex(css("--text")), text3: toHex(css("--text-3")), panel: toHex(css("--panel")), line: toHex(css("--line-2")) };
}

const graph = new graphology.Graph({ type: "directed" });
const maxPr = Math.max(...DATA.nodes.map((n) => n.pr));
const byRank = [...DATA.nodes].sort((a, b) => b.pr - a.pr);
const rank = new Map(byRank.map((n, i) => [n.id, i + 1]));
DATA.nodes.forEach((n) => graph.addNode(n.id, { x: n.x, y: -n.y, size: 2.2 + 15 * Math.sqrt(n.pr / maxPr), label: n.l, fo: n.fo, meta: n }));
DATA.edges.forEach(([s, t]) => graph.addEdge(s, t, { size: 0.6 }));
const isolated = new Set(graph.filterNodes((n) => graph.degree(n) === 0));

$("counts").textContent = `${fmt.format(DATA.nodes.length)} symbols · ${fmt.format(DATA.edges.length)} calls`;
$("isoN").textContent = isolated.size;
$("fcount").textContent = DATA.folders.length;

const hidden = new Set();
let showIso = false, selected = null, hovered = null, hoverFolder = null, neighbours = null;

buildPalette();
const renderer = new Sigma(graph, $("stage"), {
  labelFont: "IBM Plex Sans, system-ui, sans-serif", labelWeight: "500", labelSize: 12,
  labelColor: { attribute: "labelColor" }, labelDensity: 0.35, labelGridCellSize: 140,
  labelRenderedSizeThreshold: 9, zIndex: true, minCameraRatio: 0.04, maxCameraRatio: 3,
  defaultEdgeColor: palette.edge, stagePadding: 60,
  defaultDrawNodeHover: drawHover,
  nodeReducer(node, d) {
    const r = { ...d, color: palette.folders[d.fo], labelColor: palette.text };
    if (hidden.has(d.fo) || (!showIso && isolated.has(node) && node !== selected)) return { ...r, hidden: true };
    const focus = selected || hovered;
    if (focus) {
      if (node === focus) return { ...r, zIndex: 3, highlighted: false, size: d.size * 1.35, forceLabel: true };
      if (neighbours.has(node)) return { ...r, zIndex: 2, forceLabel: !!selected };
      return { ...r, color: palette.faded, label: null, zIndex: 0, size: d.size * 0.6 };
    }
    if (hoverFolder !== null && d.fo !== hoverFolder) return { ...r, color: palette.faded, label: null };
    return r;
  },
  edgeReducer(edge, d) {
    const [s, t] = graph.extremities(edge);
    const ga = graph.getNodeAttributes(s), gb = graph.getNodeAttributes(t);
    if (hidden.has(ga.fo) || hidden.has(gb.fo)) return { ...d, hidden: true };
    const focus = selected || hovered;
    if (focus) {
      if (t === focus) return { ...d, color: palette.caller, size: 1.6, zIndex: 2 };
      if (s === focus) return { ...d, color: palette.callee, size: 1.6, zIndex: 2 };
      return { ...d, hidden: true };
    }
    if (hoverFolder !== null && ga.fo !== hoverFolder && gb.fo !== hoverFolder) return { ...d, hidden: true };
    return { ...d, color: palette.edge };
  },
});

function drawHover(ctx, data, settings) {
  const label = data.label; if (!label) return;
  const size = settings.labelSize, font = `500 ${size}px IBM Plex Sans, system-ui, sans-serif`;
  ctx.font = font;
  const w = ctx.measureText(label).width, pad = 7, h = size + pad * 2;
  const x = data.x + data.size + 6, y = data.y - h / 2;
  ctx.fillStyle = palette.panel; ctx.strokeStyle = palette.line; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.roundRect(x, y, w + pad * 2, h, 6); ctx.fill(); ctx.stroke();
  ctx.fillStyle = palette.text; ctx.textBaseline = "middle"; ctx.fillText(label, x + pad, data.y + 0.5);
  ctx.beginPath(); ctx.arc(data.x, data.y, data.size + 2.5, 0, Math.PI * 2); ctx.strokeStyle = palette.text; ctx.lineWidth = 1.5; ctx.stroke();
}

// Region labels: folder names float over the centre of their symbols, like a map.
const regionEls = DATA.folders.map((f, i) => {
  const el = document.createElement("div"); el.className = "region";
  const [head, ...rest] = f.split("/"); el.innerHTML = rest.length ? `${head}/<b>${rest.join("/")}</b>` : `<b>${f}</b>`;
  $("regions").appendChild(el); return el;
});
const centroids = DATA.folders.map((_, i) => {
  const ns = DATA.nodes.filter((n) => n.fo === i && !isolated.has(n.id));
  if (ns.length < 6) return null;
  const xs = ns.map((n) => n.x).sort((a, b) => a - b), ys = ns.map((n) => -n.y).sort((a, b) => a - b);
  return { x: xs[xs.length >> 1], y: ys[ys.length >> 1] };
});
function placeRegions() {
  const ratio = renderer.getCamera().ratio;
  const focus = selected || hovered;
  regionEls.forEach((el, i) => {
    const c = centroids[i];
    const visible = c && !hidden.has(i) && !focus && ratio > 0.35 && (hoverFolder === null || hoverFolder === i);
    el.style.opacity = visible ? (ratio > 0.7 ? 1 : (ratio - 0.35) / 0.35) : 0;
    if (c) { const p = renderer.graphToViewport(c); el.style.left = p.x + "px"; el.style.top = p.y + "px"; }
  });
}
renderer.on("afterRender", placeRegions);

// Legend
DATA.folders.forEach((f, i) => {
  const count = DATA.nodes.filter((n) => n.fo === i).length;
  const b = document.createElement("button"); b.className = "chip"; b.setAttribute("aria-pressed", "true");
  b.innerHTML = `<span class="dot"></span><span>${f}</span><span class="c">${count}</span>`;
  b.onclick = () => { hidden.has(i) ? hidden.delete(i) : hidden.add(i); b.setAttribute("aria-pressed", String(!hidden.has(i))); renderer.refresh(); };
  b.onmouseenter = () => { hoverFolder = i; renderer.refresh(); };
  b.onmouseleave = () => { hoverFolder = null; renderer.refresh(); };
  $("chips").appendChild(b);
});
function paintChips() { [...$("chips").children].forEach((b, i) => b.querySelector(".dot").style.background = palette.folders[i]); }
paintChips();

$("iso").onclick = () => { showIso = !showIso; $("iso").setAttribute("aria-checked", String(showIso)); renderer.refresh(); };

// Selection and inspector
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function linkList(ids) {
  if (!ids.length) return `<div class="none">None in this repo</div>`;
  return ids.sort((a, b) => rank.get(a) - rank.get(b)).map((id) => {
    const m = graph.getNodeAttribute(id, "meta");
    return `<button class="link" data-id="${esc(id)}"><span class="dot" style="background:${palette.folders[m.fo]}"></span><span class="n">${esc(m.l)}<small>${esc(m.f.split("/").pop())}:${m.ln}</small></span></button>`;
  }).join("");
}
function select(id, fly = true) {
  selected = id; neighbours = new Set(graph.neighbors(id));
  const m = graph.getNodeAttribute(id, "meta");
  $("iKind").innerHTML = `<span class="dot" style="background:${palette.folders[m.fo]}"></span>${esc(m.k)} · ${esc(DATA.folders[m.fo])}`;
  $("iName").textContent = m.l;
  $("iPath").textContent = `${m.f}:${m.ln}`;
  $("iSig").textContent = m.s;
  $("iRank").textContent = `#${rank.get(id)}`;
  const ins = graph.inNeighbors(id), outs = graph.outNeighbors(id);
  $("iInN").textContent = ins.length; $("iOutN").textContent = outs.length;
  $("iIn").innerHTML = linkList(ins); $("iOut").innerHTML = linkList(outs);
  $("iLearn").innerHTML = `<div class="note">No learnings touch this symbol yet. Save one with<code>knot note --touches ${esc(m.f)}#${esc(m.l.split("::").pop())}</code></div>`;
  document.body.classList.add("inspecting"); $("ins").setAttribute("aria-hidden", "false");
  renderer.refresh();
  if (fly) {
    // Frame the symbol with everything it touches, leaving room for the inspector.
    const pts = [id, ...neighbours].map((n) => renderer.getNodeDisplayData(n)).filter(Boolean);
    const xs = pts.map((p) => p.x), ys = pts.map((p) => p.y);
    const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
    const span = Math.max(x1 - x0, y1 - y0, 0.06);
    const ratio = Math.min(1.2, span * 1.5);
    renderer.getCamera().animate({ x: (x0 + x1) / 2 + ratio * 0.12, y: (y0 + y1) / 2, ratio }, { duration: 650, easing: (t) => 1 - Math.pow(2, -10 * t) });
  }
}
function clear() {
  selected = null; neighbours = hovered ? new Set(graph.neighbors(hovered)) : null;
  document.body.classList.remove("inspecting"); $("ins").setAttribute("aria-hidden", "true"); renderer.refresh();
}
document.querySelector(".ins-body").addEventListener("click", (e) => { const b = e.target.closest(".link"); if (b) select(b.dataset.id); });
$("close").onclick = clear;
renderer.on("clickNode", ({ node }) => select(node));
renderer.on("clickStage", clear);
renderer.on("enterNode", ({ node }) => { hovered = node; if (!selected) neighbours = new Set(graph.neighbors(node)); $("stage").style.cursor = "pointer"; renderer.refresh(); });
renderer.on("leaveNode", () => { hovered = null; if (!selected) neighbours = null; $("stage").style.cursor = ""; renderer.refresh(); });

// Search: ranked by match quality, then centrality
const q = $("q"), results = $("results");
let hits = [], active = 0;
function score(n, s) {
  const name = n.l.toLowerCase(), file = n.f.toLowerCase();
  if (name === s) return 100; if (name.startsWith(s)) return 80; if (name.includes(s)) return 60;
  if (file.includes(s)) return 30;
  let i = 0; for (const ch of name) if (ch === s[i]) i++; return i === s.length ? 15 : 0;
}
function search() {
  const s = q.value.trim().toLowerCase();
  if (!s) { results.classList.remove("open"); q.parentElement.setAttribute("aria-expanded", "false"); return; }
  hits = DATA.nodes.map((n) => [n, score(n, s)]).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1] || b[0].pr - a[0].pr).slice(0, 8).map(([n]) => n);
  active = 0;
  results.innerHTML = hits.length ? hits.map((n, i) => `<button class="res" role="option" aria-selected="${i === 0}" data-id="${esc(n.id)}"><span class="dot" style="background:${palette.folders[n.fo]}"></span><span class="n">${esc(n.l)}</span><span class="p">${esc(n.f)}:${n.ln}</span></button>`).join("") : `<div class="empty">No symbol or file matches “${esc(q.value.trim())}”</div>`;
  results.classList.add("open"); q.parentElement.setAttribute("aria-expanded", "true");
}
function pick(id) { q.value = ""; if (isolated.has(id) && !showIso) { showIso = true; $("iso").setAttribute("aria-checked", "true"); } results.classList.remove("open"); q.blur(); select(id); }
q.addEventListener("input", search);
q.addEventListener("keydown", (e) => {
  const rows = [...results.querySelectorAll(".res")];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); if (!rows.length) return; active = (active + (e.key === "ArrowDown" ? 1 : rows.length - 1)) % rows.length; rows.forEach((r, i) => r.setAttribute("aria-selected", String(i === active))); rows[active].scrollIntoView({ block: "nearest" }); }
  if (e.key === "Enter" && hits[active]) pick(hits[active].id);
  if (e.key === "Escape") { q.value = ""; search(); q.blur(); }
});
results.addEventListener("click", (e) => { const b = e.target.closest(".res"); if (b) pick(b.dataset.id); });
addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); q.select(); }
  else if (e.key === "Escape" && document.activeElement !== q) clear();
});

// Zoom and theme
const cam = renderer.getCamera(), ease = (t) => 1 - Math.pow(2, -10 * t);
$("zin").onclick = () => cam.animatedZoom({ duration: 300, easing: ease });
$("zout").onclick = () => cam.animatedUnzoom({ duration: 300, easing: ease });
$("zfit").onclick = () => cam.animatedReset({ duration: 500, easing: ease });
function applyTheme() {
  document.documentElement.dataset.theme = theme;
  buildPalette(); paintChips();
  renderer.setSetting("defaultEdgeColor", palette.edge);
  if (selected) select(selected, false); else renderer.refresh();
}
$("theme").onclick = () => { theme = theme === "dark" ? "light" : "dark"; applyTheme(); };
applyTheme();

// The one authored moment: the map settles in from a wide view.
cam.setState({ ratio: 2.4 });
requestAnimationFrame(() => cam.animate({ ratio: 1 }, { duration: 1100, easing: ease }));
</script>
