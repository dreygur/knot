[package]
name = "knot"
version = "0.4.2"
edition = "2021"
description = "Code graph search and team learnings for coding agents (CLI and MCP server)"

[package.metadata.knot]
short_description = "Knot: code graph search and team learnings for coding agents"

[[bin]]
name = "knot"
path = "src/main.rs"

[lib]
name = "knot"
path = "src/lib.rs"

[dependencies]
# Tokenising Bash commands the hooks inspect
shell-words = "1.1"

# MCP transport
rmcp = { version = "3.8", features = ["server", "transport-io"] }
schemars = "1.2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"

# Hashing symbol definitions and denied commands
blake3 = "1"

# Grep patterns and pinned values in knot check
regex = "1"
once_cell = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"

# Cross-platform path helpers
dirs = "7"

# AST and Code Graph Engine
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-php = "0.25"
tree-sitter-ruby = "0.23"
tree-sitter-c = "0.24"
rayon = "1.10"
ignore = "0.4"
git2 = { version = "0.21", default-features = false }

# Terminal UI
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"

# Share card: SVG to PNG with embedded fonts only (no system fonts, same output everywhere)
resvg = { version = "0.49", default-features = false, features = ["text", "raster-images"] }
skrifa = "0.49"
base64 = "0.23"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[dev-dependencies]
tempfile = "3"

# Release builds kept debug symbols and skipped LTO, so the binary grew past 26 MB
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
