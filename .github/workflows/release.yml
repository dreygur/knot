name: Release

# Disabled on 2026-10-27 while GitHub Actions is unavailable on this account: runs only when
# started by hand. To re-enable tag releases, restore:
#   push:
#     tags:
#       - 'v*'
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: knot-x86_64-unknown-linux-gnu

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: knot-x86_64-apple-darwin

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: knot-aarch64-apple-darwin

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: knot-x86_64-pc-windows-msvc.exe

    steps:
      - uses: actions/checkout@v7

      - name: Sync manifests from Cargo.toml
        run: python3 scripts/sync-manifests.py

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          mkdir -p release
          EXT=$([[ "$RUNNER_OS" == "Windows" ]] && echo ".exe" || echo "")
          cp "target/${{ matrix.target }}/release/knot${EXT}" "release/${{ matrix.artifact }}"

      # Each build job only hands its binary on; one job below checksums all of them, so
      # SHA256SUMS is no longer overwritten by whichever upload finished last.
      - name: Keep binary for the release job
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect binaries
        uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true

      - name: Checksum every binary
        working-directory: release
        run: sha256sum knot-* > SHA256SUMS

      - name: Upload release assets
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
