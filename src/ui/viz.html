<!DOCTYPE html>
<!--
{{LICENSES}}-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>knot · code graph</title>
<link rel="icon" type="image/png" media="(prefers-color-scheme: dark)" href="{{MARK_LIGHT}}">
<link rel="icon" type="image/png" media="(prefers-color-scheme: light)" href="{{MARK_DARK}}">
<script>document.documentElement.dataset.theme = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";</script>
<style>
{{FONTS_CSS}}
  :root {
    --ink: #07090f;
    --ink-2: #0d111b;
    --panel: #10141f;
    --line: #1f2636;
    --line-2: #2a3349;
    --text: #e8ebf4;
    --text-2: #a3abc2;
    --text-3: #7a839c;
    --caller: #5ad1e6;
    --callee: #f2b866;
    --focus: #8fa8ff;
    --shadow: 0 12px 32px -12px rgb(0 0 0 / .6), 0 2px 6px -2px rgb(0 0 0 / .5);
    --sans: "Knot Sans", ui-sans-serif, system-ui, sans-serif;
    --mono: "Knot Mono", ui-monospace, "SF Mono", monospace;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --ink: #f4f2ed;
    --ink-2: #ebe8e1;
    --panel: #fbfaf7;
    --line: #dcd8cf;
    --line-2: #c9c4b8;
    --text: #1b1d24;
    --text-2: #4a4f5e;
    --text-3: #676c7a;
    --caller: #0a7f95;
    --callee: #a8620a;
    --focus: #3550d6;
    --shadow: 0 12px 32px -14px rgb(40 30 10 / .25), 0 2px 6px -2px rgb(40 30 10 / .12);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text); font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
  ::selection { background: color-mix(in oklab, var(--focus) 35%, transparent); color: var(--text); }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  code, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

  #stage { position: fixed; inset: 0; background:
      radial-gradient(1200px 800px at 45% 40%, var(--ink-2), var(--ink) 70%); }
  #regions { position: fixed; inset: 0; pointer-events: none; }
  .region { position: absolute; transform: translate(-50%, -50%); font: 600 13px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); white-space: nowrap; transition: opacity .3s; }
  .region b { font-weight: 600; color: var(--text-2); }

  .status { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; text-align: center; color: var(--text-2); }
  .status[hidden] { display: none; }
  .status p { margin: 0; font-size: 15px; }
  .status small { display: block; margin-top: 8px; color: var(--text-3); font-size: 13px; }
  .status code { color: var(--text); }
  .bar { width: 180px; height: 2px; margin: 14px auto 0; background: var(--line); border-radius: 1px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--focus); transition: width .2s; }

  .top { position: fixed; top: 16px; left: 16px; right: 16px; display: flex; align-items: center; gap: 12px; pointer-events: none; }
  .top > * { pointer-events: auto; }
  .mark { display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
  .mark img { height: 20px; width: auto; display: block; }
  .mark .logo-dark { display: none; }
  :root[data-theme="light"] .mark .logo-light { display: none; }
  :root[data-theme="light"] .mark .logo-dark { display: block; }
  .mark span { color: var(--text-3); font-size: 13px; }
  .mark .mono { color: var(--text-2); }
  .search { flex: 0 1 420px; margin-left: auto; margin-right: auto; display: flex; align-items: center; gap: 10px; padding: 0 12px; height: 40px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); color: var(--text-3); position: relative; }
  .search:focus-within { border-color: var(--line-2); }
  .search input { flex: 1; min-width: 0; height: 100%; background: none; border: 0; outline: 0; color: var(--text); font: 14px var(--sans); }
  .search input::placeholder { color: var(--text-3); }
  kbd { font: 400 12px/1 var(--mono); color: var(--text-3); padding: 4px 6px; border: 1px solid var(--line-2); border-radius: 5px; }
  .theme { width: 40px; height: 40px; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); color: var(--text-2); }
  .theme:hover { color: var(--text); border-color: var(--line-2); }

  .results { position: absolute; top: 46px; left: 0; right: 0; max-height: 360px; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; display: none; }
  .results.open { display: block; }
  .res { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 8px 10px; border-radius: 7px; }
  .res[aria-selected="true"], .res:hover { background: var(--ink-2); }
  .res .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .res .p { font: 12px var(--mono); color: var(--text-3); white-space: nowrap; }
  .empty { padding: 14px 10px; color: var(--text-3); }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }

  .legend { position: fixed; left: 16px; bottom: 16px; width: 248px; max-height: calc(100vh - 120px); overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 12px 8px 8px; }
  .legend h2 { margin: 0 8px 8px; font: 600 13px/1.2 var(--sans); color: var(--text-2); display: flex; justify-content: space-between; }
  .legend h2 span { font: 400 12px var(--mono); color: var(--text-3); }
  .chip { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; border-radius: 7px; text-align: left; font-size: 13px; color: var(--text); }
  .chip:hover { background: var(--ink-2); }
  .chip .c { font: 12px var(--mono); color: var(--text-3); }
  .chip[aria-pressed="false"] { color: var(--text-3); }
  .chip[aria-pressed="false"] .dot { background: transparent !important; box-shadow: inset 0 0 0 1.5px var(--line-2); }
  .toggle { margin: 8px 8px 2px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-2); }
  .switch { width: 32px; height: 18px; border-radius: 9px; background: var(--line-2); position: relative; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--text); transition: transform .25s cubic-bezier(.2,.8,.2,1); }
  .switch[aria-checked="true"] { background: var(--focus); }
  .switch[aria-checked="true"]::after { transform: translateX(14px); }

  .zoom { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; transition: right .45s cubic-bezier(.16,1,.3,1); }
  .zoom button { width: 40px; height: 40px; display: grid; place-items: center; color: var(--text-2); }
  .zoom button + button { border-top: 1px solid var(--line); }
  .zoom button:hover { color: var(--text); background: var(--ink-2); }
  body.inspecting .zoom { right: 392px; }

  .inspector { position: fixed; top: 72px; right: 16px; bottom: 16px; width: 360px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; transform: translateX(calc(100% + 24px)); transition: transform .45s cubic-bezier(.16,1,.3,1); }
  body.inspecting .inspector { transform: none; }
  .ins-head { padding: 18px 18px 14px; border-bottom: 1px solid var(--line); position: relative; }
  .ins-close { position: absolute; top: 12px; right: 12px; width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; color: var(--text-3); }
  .ins-close:hover { color: var(--text); background: var(--ink-2); }
  .kind { display: inline-flex; align-items: center; gap: 8px; font: 400 12px var(--mono); color: var(--text-2); }
  .ins-name { margin: 10px 40px 6px 0; font: 600 22px/1.15 var(--sans); letter-spacing: -.02em; overflow-wrap: anywhere; }
  .ins-path { font: 13px var(--mono); color: var(--text-2); overflow-wrap: anywhere; }
  .ins-body { overflow: auto; padding: 14px 18px 18px; display: flex; flex-direction: column; gap: 20px; }
  .sig { margin: 0; padding: 12px; background: var(--ink-2); border: 1px solid var(--line); border-radius: 8px; font: 12.5px/1.55 var(--mono); color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); border-radius: 8px; }
  .stat { padding: 10px 12px; }
  .stat + .stat { border-left: 1px solid var(--line); }
  .stat .v { font: 400 18px/1.1 var(--mono); }
  .stat .k { font-size: 12px; color: var(--text-3); margin-top: 3px; }
  .stat.callers .v { color: var(--caller); }
  .stat.callees .v { color: var(--callee); }
  .sec h2 { margin: 0 0 6px; font: 600 13px var(--sans); color: var(--text-2); display: flex; align-items: center; gap: 8px; }
  .sec h2 i { width: 14px; height: 2px; border-radius: 1px; }
  .link { display: grid; grid-template-columns: 10px 1fr; align-items: center; gap: 10px; width: 100%; padding: 6px 8px; margin: 0 -8px; border-radius: 7px; text-align: left; }
  .link:hover { background: var(--ink-2); }
  .link .n { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
  .link .n small { font: 12px var(--mono); color: var(--text-3); margin-left: 6px; }
  .none { color: var(--text-3); font-size: 13px; }
  .note { padding: 12px; border: 1px dashed var(--line-2); border-radius: 8px; color: var(--text-2); font-size: 13px; }
  .note code { display: block; margin-top: 8px; font-size: 12px; color: var(--text); overflow-wrap: anywhere; }
  .learn { padding: 8px 0; }
  .learn + .learn { border-top: 1px solid var(--line); }
  .learn .t { font-size: 13.5px; color: var(--text); }
  .learn .by { margin-top: 2px; font: 12px var(--mono); color: var(--text-3); }

  .hint { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); font-size: 12.5px; color: var(--text-3); display: flex; gap: 14px; white-space: nowrap; transition: opacity .3s; }
  body.inspecting .hint, body.blank .hint, body.blank .legend, body.blank .zoom, body.blank .search { opacity: 0; pointer-events: none; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 10px; border: 3px solid var(--panel); }
  ::-webkit-scrollbar-track { background: transparent; }
  * { scrollbar-color: var(--line-2) transparent; scrollbar-width: thin; }

  @media (max-width: 760px) {
    .mark span { display: none; }
    .search { min-width: 0; }
    .search kbd { display: none; }
    .legend { display: none; }
    .inspector { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; height: 62vh; transform: translateY(calc(100% + 24px)); }
    body.inspecting .zoom { right: 16px; bottom: calc(62vh + 20px); }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition-duration: 0s !important; } }
</style>
</head>

  <button id="zfit" aria-label="Fit everything"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6V2.5H6M10 2.5h3.5V6M13.5 10v3.5H10M6 13.5H2.5V10"/></svg></button>

<script id="lib-graphology">{{GRAPHOLOGY}}</script>
<script>{{SIGMA}}</script>
<script id="lib-fa2">{{FA2}}</script>
<script>
const DATA = {{DATA}};
const LABEL_FONT = '"Knot Sans", system-ui, sans-serif';
const SETTLE_RATIO = 2.4;
const SETTLE_MS = 1100;
const WORKER_STEP = 40;
const FRAME_STEP = 3;
const FRAME_BUDGET_MS = 12;
// Bump the version when the layout changes, so old cached maps are not reused.
const CACHE_PREFIX = "knot-viz:1:";

const $ = (id) => document.getElementById(id);
const fmt = new Intl.NumberFormat("en");
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const ease = (t) => 1 - Math.pow(2, -10 * t);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

// WebGL needs plain RGB, so paint each CSS colour once and read the pixel back.
const toHex = (() => {
  const c = document.createElement("canvas"); c.width = c.height = 1;
  const x = c.getContext("2d", { willReadFrequently: true });
  return (color) => {
    x.clearRect(0, 0, 1, 1); x.fillStyle = color; x.fillRect(0, 0, 1, 1);
    const [r, g, b] = x.getImageData(0, 0, 1, 1).data;
    return "#" + [r, g, b].map((v) => v.toString(16).padStart(2, "0")).join("");
  };
})();

// Golden angle hue steps with alternating lightness keep neighbouring folders apart.
const HUES = DATA.folders.map((_, i) => (i * 137.508 + 200) % 360);
const systemLight = matchMedia("(prefers-color-scheme: light)");
let theme = systemLight.matches ? "light" : "dark", themePicked = false, palette;
const folderColor = (fo) => theme === "dark" ? `oklch(${fo % 2 ? 0.7 : 0.82} 0.13 ${HUES[fo]})` : `oklch(${fo % 2 ? 0.5 : 0.6} 0.15 ${HUES[fo]})`;

function buildPalette() {
  palette = {
    folders: DATA.folders.map((_, i) => toHex(folderColor(i))),
    edge: theme === "dark" ? "#2a3349" : "#cfc9bc", faded: theme === "dark" ? "#111623" : "#e6e2da",
    caller: toHex(css("--caller")), callee: toHex(css("--callee")), text: toHex(css("--text")),
    text3: toHex(css("--text-3")), panel: toHex(css("--panel")), line: toHex(css("--line-2")),
  };
}

// ForceAtlas2 with one hidden anchor per folder, tied to its members, so each folder
// settles into its own region and calls between folders read as bridges. It uses no
// outside names but the two libraries, so a worker can run it from its source text.
function makeLayout(input) {
  const ITERATIONS = 1200, MIN_ITERATIONS = 240, SETTLED = 5.5e-4, SEED = 0x6b6e6f74;
  const fa2 = graphologyLibrary.layoutForceAtlas2;
  let seed = SEED;
  const random = () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

  const { n, nf, fo, edges } = input;
  const L = new graphology.Graph({ type: "undirected" });
  for (let i = 0; i < n; i++) {
    const a = (fo[i] / nf) * Math.PI * 2;
    L.addNode(String(i), { x: Math.cos(a) * 100 + random() * 20, y: Math.sin(a) * 100 + random() * 20 });
  }
  for (let e = 0; e < edges.length; e += 2) {
    const s = String(edges[e]), t = String(edges[e + 1]);
    if (!L.hasEdge(s, t)) {
      L.addEdge(s, t, { weight: 1 });
    }
  }
  for (let f = 0; f < nf; f++) {
    const a = (f / nf) * Math.PI * 2;
    L.addNode("@" + f, { x: Math.cos(a) * 400, y: Math.sin(a) * 400 });
  }
  for (let i = 0; i < n; i++) {
    L.addEdge(String(i), "@" + fo[i], { weight: 1.5 });
  }
  const settings = { ...fa2.inferSettings(L), gravity: 0.4, scalingRatio: 3, barnesHutOptimize: true, edgeWeightInfluence: 1, linLogMode: true, outboundAttractionDistribution: true };

  const positions = () => {
    const p = new Float64Array(n * 2);
    for (let i = 0; i < n; i++) {
      const a = L.getNodeAttributes(String(i));
      p[2 * i] = a.x; p[2 * i + 1] = a.y;
    }
    return p;
  };

  // Motion is the mean distance a symbol moves per iteration, relative to the mean
  // distance from the centre, so one threshold fits small and large graphs.
  let done = 0, motion = Infinity;
  return {
    get progress() { return done / ITERATIONS; },
    get motion() { return motion; },
    step(k) {
      const before = positions();
      fa2.assign(L, { iterations: Math.min(k, ITERATIONS - done), getEdgeWeight: "weight", settings });
      done = Math.min(ITERATIONS, done + k);
      const after = positions();
      let moved = 0, spread = 0;
      for (let i = 0; i < after.length; i += 2) {
        moved += Math.hypot(after[i] - before[i], after[i + 1] - before[i + 1]);
        spread += Math.hypot(after[i], after[i + 1]);
      }
      motion = moved / k / (spread || 1);
      return done >= ITERATIONS || (done >= MIN_ITERATIONS && motion < SETTLED);
    },
    positions,
  };
}

// graphology-library builds its GEXF parser from DOMParser and Document as it loads;
// workers have neither, and the layout never parses, so empty stand-ins suffice.
const WORKER_PRELUDE = "self.DOMParser = self.DOMParser || function () {}; self.Document = self.Document || function () {};";

function workerLayout(input, onProgress, onDone, onFail) {
  const body = `onmessage = (e) => { const job = makeLayout(e.data); while (!job.step(${WORKER_STEP})) { postMessage({ p: job.progress }); } const pos = job.positions(); postMessage({ pos }, [pos.buffer]); };`;
  const src = [WORKER_PRELUDE, $("lib-graphology").textContent, $("lib-fa2").textContent, makeLayout.toString(), body].join("\n;\n");
  const url = URL.createObjectURL(new Blob([src], { type: "text/javascript" }));
  const w = new Worker(url);
  const stop = () => { w.terminate(); URL.revokeObjectURL(url); };
  w.onmessage = (e) => {
    if (!e.data.pos) {
      onProgress(e.data.p);
      return;
    }
    stop();
    onDone(e.data.pos);
  };
  w.onerror = (e) => { e.preventDefault(); stop(); onFail(); };
  w.postMessage(input);
}

// Some file:// contexts refuse workers; then the layout runs a few iterations at a
// time, as many as fit in a frame, so the page keeps responding.
function frameLayout(input, onProgress, onDone) {
  const job = makeLayout(input);
  const tick = () => {
    const t0 = performance.now();
    let finished;
    do { finished = job.step(FRAME_STEP); } while (!finished && performance.now() - t0 < FRAME_BUDGET_MS);
    onProgress(job.progress);
    if (finished) {
      onDone(job.positions());
      return;
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

// FNV-1a over the folders and edges: the same graph gives the same key.
function layoutKey(input) {
  let h = 0x811c9dc5;
  for (const list of [input.fo, input.edges]) {
    for (const v of list) {
      h = Math.imul(h ^ v, 0x01000193);
    }
    h = Math.imul(h ^ 0xff, 0x01000193);
  }
  return `${CACHE_PREFIX}${input.n}:${(h >>> 0).toString(16)}`;
}

// A finished layout is kept in localStorage, so opening the same graph again skips it.
// Storage can be missing, full or blocked on file://; any failure just means computing.
function cachedLayout(key, n) {
  try {
    const pos = JSON.parse(localStorage.getItem(key) || "null");
    return Array.isArray(pos) && pos.length === n * 2 ? Float64Array.from(pos) : null;
  } catch (_) {
    return null;
  }
}

function keepLayout(key, pos) {
  const text = JSON.stringify(Array.from(pos, (v) => Math.round(v * 100) / 100));
  try {
    localStorage.setItem(key, text);
    return;
  } catch (_) {}
  try {
    Object.keys(localStorage).filter((k) => k.startsWith(CACHE_PREFIX)).forEach((k) => localStorage.removeItem(k));
    localStorage.setItem(key, text);
  } catch (_) {}
}

function layout(onDone) {
  const input = { n: DATA.nodes.length, nf: DATA.folders.length, fo: Int32Array.from(DATA.nodes, (d) => d.fo), edges: Int32Array.from(DATA.edges.flat()) };
  const key = layoutKey(input);
  const hit = cachedLayout(key, input.n);
  if (hit) {
    onDone(hit);
    return;
  }

  const progress = (p) => { $("barFill").style.width = (p * 100).toFixed(1) + "%"; };
  const finish = (pos) => { keepLayout(key, pos); onDone(pos); };
  const fallback = () => frameLayout(input, progress, finish);
  try {
    workerLayout(input, progress, finish, fallback);
  } catch (_) {
    fallback();
  }
}

// The map does not exist until the layout finishes, so the toggle only swaps colours
// until then; start() replaces this with one that repaints the map too.
let applyTheme = () => { document.documentElement.dataset.theme = theme; buildPalette(); };

function start(pos) {
  $("status").hidden = true;
  document.body.classList.remove("blank");

  const graph = new graphology.Graph({ type: "directed" });
  const maxPr = DATA.nodes.reduce((m, n) => Math.max(m, n.pr), 0) || 1;
  const byRank = [...DATA.nodes].sort((a, b) => b.pr - a.pr);
  const rank = new Map(byRank.map((n, i) => [n.id, i + 1]));
  DATA.nodes.forEach((n, i) => graph.addNode(n.id, { x: pos[2 * i], y: -pos[2 * i + 1], size: 2.2 + 15 * Math.sqrt(n.pr / maxPr), label: n.l, fo: n.fo, meta: n }));
  DATA.edges.forEach(([s, t]) => graph.addEdge(DATA.nodes[s].id, DATA.nodes[t].id, { size: 0.6 }));
  const isolated = new Set(graph.filterNodes((n) => graph.degree(n) === 0));
  $("isoN").textContent = isolated.size;
  $("fcount").textContent = DATA.folders.length;

  const hidden = new Set();
  let showIso = false, selected = null, hovered = null, hoverFolder = null, neighbours = null;

  function drawHover(ctx, data, settings) {
    const label = data.label;
    if (!label) {
      return;
    }
    const size = settings.labelSize;
    ctx.font = `600 ${size}px ${LABEL_FONT}`;
    const w = ctx.measureText(label).width, pad = 7, h = size + pad * 2;
    const x = data.x + data.size + 6, y = data.y - h / 2;
    ctx.fillStyle = palette.panel; ctx.strokeStyle = palette.line; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.roundRect(x, y, w + pad * 2, h, 6); ctx.fill(); ctx.stroke();
    ctx.fillStyle = palette.text; ctx.textBaseline = "middle"; ctx.fillText(label, x + pad, data.y + 0.5);
    ctx.beginPath(); ctx.arc(data.x, data.y, data.size + 2.5, 0, Math.PI * 2); ctx.strokeStyle = palette.text; ctx.lineWidth = 1.5; ctx.stroke();
  }

  function nodeReducer(node, d) {
    const r = { ...d, color: palette.folders[d.fo], labelColor: palette.text };
    if (hidden.has(d.fo) || (!showIso && isolated.has(node) && node !== selected)) {
      return { ...r, hidden: true };
    }
    const focus = selected || hovered;
    if (focus && node === focus) {
      return { ...r, zIndex: 3, highlighted: false, size: d.size * 1.35, forceLabel: true };
    }
    if (focus && neighbours.has(node)) {
      return { ...r, zIndex: 2, forceLabel: !!selected };
    }
    if (focus) {
      return { ...r, color: palette.faded, label: null, zIndex: 0, size: d.size * 0.6 };
    }
    if (hoverFolder !== null && d.fo !== hoverFolder) {
      return { ...r, color: palette.faded, label: null };
    }
    return r;
  }

  function edgeReducer(edge, d) {
    const [s, t] = graph.extremities(edge);
    const ga = graph.getNodeAttributes(s), gb = graph.getNodeAttributes(t);
    if (hidden.has(ga.fo) || hidden.has(gb.fo)) {
      return { ...d, hidden: true };
    }
    const focus = selected || hovered;
    if (focus && t === focus) {
      return { ...d, color: palette.caller, size: 1.6, zIndex: 2 };
    }
    if (focus && s === focus) {
      return { ...d, color: palette.callee, size: 1.6, zIndex: 2 };
    }
    if (focus || (hoverFolder !== null && ga.fo !== hoverFolder && gb.fo !== hoverFolder)) {
      return { ...d, hidden: true };
    }
    return { ...d, color: palette.edge };
  }

  // sigma draws with WebGL. Without it the bundle fails to define Sigma or the
  // constructor throws, and the page would stay blank.
  let renderer;
  try {
    renderer = new Sigma(graph, $("stage"), {
      labelFont: LABEL_FONT, labelWeight: "600", labelSize: 12,
      labelColor: { attribute: "labelColor" }, labelDensity: 0.35, labelGridCellSize: 140,
      labelRenderedSizeThreshold: 9, zIndex: true, minCameraRatio: 0.04, maxCameraRatio: 3,
      defaultEdgeColor: palette.edge, stagePadding: 60,
      defaultDrawNodeHover: drawHover, nodeReducer, edgeReducer,
    });
  } catch (_) {
    document.body.classList.add("blank");
    $("status").hidden = false; $("bar").hidden = true;
    $("statusText").textContent = "This browser has WebGL turned off, so the map can't draw.";
    return;
  }
  const cam = renderer.getCamera();

  // Folder names float over the median of their symbols, like a map.
  const regionEls = DATA.folders.map((f) => {
    const el = document.createElement("div"); el.className = "region";
    const [head, ...rest] = f.split("/");
    el.innerHTML = rest.length ? `${esc(head)}/<b>${esc(rest.join("/"))}</b>` : `<b>${esc(f)}</b>`;
    $("regions").appendChild(el);
    return el;
  });
  const centroids = DATA.folders.map((_, i) => {
    const ns = graph.filterNodes((id, a) => a.fo === i && !isolated.has(id)).map((id) => graph.getNodeAttributes(id));
    if (ns.length < 6) {
      return null;
    }
    const xs = ns.map((a) => a.x).sort((a, b) => a - b), ys = ns.map((a) => a.y).sort((a, b) => a - b);
    return { x: xs[xs.length >> 1], y: ys[ys.length >> 1] };
  });
  function placeRegions() {
    const ratio = cam.ratio;
    const focus = selected || hovered;
    regionEls.forEach((el, i) => {
      const c = centroids[i];
      const visible = c && !hidden.has(i) && !focus && ratio > 0.35 && (hoverFolder === null || hoverFolder === i);
      el.style.opacity = visible ? (ratio > 0.7 ? 1 : (ratio - 0.35) / 0.35) : 0;
      if (c) {
        const p = renderer.graphToViewport(c);
        el.style.left = p.x + "px"; el.style.top = p.y + "px";
      }
    });
  }
  renderer.on("afterRender", placeRegions);

  DATA.folders.forEach((f, i) => {
    const count = DATA.nodes.filter((n) => n.fo === i).length;
    const b = document.createElement("button"); b.className = "chip"; b.setAttribute("aria-pressed", "true");
    b.innerHTML = `<span class="dot"></span><span>${esc(f)}</span><span class="c">${count}</span>`;
    b.onclick = () => {
      if (hidden.has(i)) {
        hidden.delete(i);
      } else {
        hidden.add(i);
      }
      b.setAttribute("aria-pressed", String(!hidden.has(i)));
      renderer.refresh();
    };
    b.onmouseenter = () => { hoverFolder = i; renderer.refresh(); };
    b.onmouseleave = () => { hoverFolder = null; renderer.refresh(); };
    $("chips").appendChild(b);
  });
  const paintChips = () => [...$("chips").children].forEach((b, i) => { b.querySelector(".dot").style.background = palette.folders[i]; });

  const setShowIso = (on) => { showIso = on; $("iso").setAttribute("aria-checked", String(on)); };
  $("iso").onclick = () => { setShowIso(!showIso); renderer.refresh(); };

  function linkList(ids) {
    if (!ids.length) {
      return `<div class="none">None in this repo</div>`;
    }
    return ids.sort((a, b) => rank.get(a) - rank.get(b)).map((id) => {
      const m = graph.getNodeAttribute(id, "meta");
      return `<button class="link" data-id="${esc(id)}"><span class="dot" style="background:${palette.folders[m.fo]}"></span><span class="n">${esc(m.l)}<small>${esc(m.f.split("/").pop())}:${m.ln}</small></span></button>`;
    }).join("");
  }
  function learnList(m) {
    if (!m.le.length) {
      return `<div class="note">No learnings touch this file yet. Save one with<code>knot note --title "&lt;the fact&gt;" --touches "${esc(m.f)}"</code></div>`;
    }
    return m.le.map((i) => DATA.learnings[i]).map((L) => `<div class="learn"><div class="t">${esc(L.title)}</div><div class="by">${esc(L.author)} · ${esc(L.date)}</div></div>`).join("");
  }

  // Frame the symbol with everything it touches, leaving room for the inspector.
  function frame(id) {
    const pts = [id, ...neighbours].map((n) => renderer.getNodeDisplayData(n)).filter(Boolean);
    const xs = pts.map((p) => p.x), ys = pts.map((p) => p.y);
    const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)];
    const ratio = Math.min(1.2, Math.max(x1 - x0, y1 - y0, 0.06) * 1.5);
    cam.animate({ x: (x0 + x1) / 2 + ratio * 0.12, y: (y0 + y1) / 2, ratio }, { duration: 650, easing: ease });
  }

  function select(id, fly = true) {
    if (isolated.has(id) && !showIso) {
      setShowIso(true);
    }
    selected = id; neighbours = new Set(graph.neighbors(id));
    const m = graph.getNodeAttribute(id, "meta");
    if (hidden.has(m.fo)) {
      hidden.delete(m.fo);
      $("chips").children[m.fo].setAttribute("aria-pressed", "true");
    }
    $("iKind").innerHTML = `<span class="dot" style="background:${palette.folders[m.fo]}"></span>${esc(m.k)} · ${esc(DATA.folders[m.fo])}`;
    $("iName").textContent = m.l;
    $("iPath").textContent = `${m.f}:${m.ln}`;
    $("iSig").textContent = m.s;
    $("iRank").textContent = `#${rank.get(id)}`;
    const ins = graph.inNeighbors(id), outs = graph.outNeighbors(id);
    $("iInN").textContent = ins.length; $("iOutN").textContent = outs.length;
    $("iIn").innerHTML = linkList(ins); $("iOut").innerHTML = linkList(outs);
    $("iLearn").innerHTML = learnList(m);
    document.body.classList.add("inspecting"); $("ins").setAttribute("aria-hidden", "false");
    renderer.refresh();
    if (fly) {
      frame(id);
    }
  }
  function clear() {
    selected = null; neighbours = hovered ? new Set(graph.neighbors(hovered)) : null;
    document.body.classList.remove("inspecting"); $("ins").setAttribute("aria-hidden", "true");
    renderer.refresh();
  }
  document.querySelector(".ins-body").addEventListener("click", (e) => {
    const b = e.target.closest(".link");
    if (b) {
      select(b.dataset.id);
    }
  });
  $("close").onclick = clear;
  renderer.on("clickNode", ({ node }) => select(node));
  renderer.on("clickStage", clear);
  renderer.on("enterNode", ({ node }) => {
    hovered = node;
    if (!selected) {
      neighbours = new Set(graph.neighbors(node));
    }
    $("stage").style.cursor = "pointer"; renderer.refresh();
  });
  renderer.on("leaveNode", () => {
    hovered = null;
    if (!selected) {
      neighbours = null;
    }
    $("stage").style.cursor = ""; renderer.refresh();
  });

  const q = $("q"), results = $("results");
  let hits = [], active = 0;
  function score(n, s) {
    const name = n.l.toLowerCase(), file = n.f.toLowerCase();
    if (name === s) {
      return 100;
    }
    if (name.startsWith(s)) {
      return 80;
    }
    if (name.includes(s)) {
      return 60;
    }
    if (file.includes(s)) {
      return 30;
    }
    let i = 0;
    for (const ch of name) {
      if (ch === s[i]) {
        i++;
      }
    }
    return i === s.length ? 15 : 0;
  }
  function search() {
    const s = q.value.trim().toLowerCase();
    if (!s) {
      results.classList.remove("open"); q.parentElement.setAttribute("aria-expanded", "false");
      return;
    }
    hits = DATA.nodes.map((n) => [n, score(n, s)]).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1] || b[0].pr - a[0].pr).slice(0, 8).map(([n]) => n);
    active = 0;
    results.innerHTML = hits.length
      ? hits.map((n, i) => `<button class="res" role="option" aria-selected="${i === 0}" data-id="${esc(n.id)}"><span class="dot" style="background:${palette.folders[n.fo]}"></span><span class="n">${esc(n.l)}</span><span class="p">${esc(n.f)}:${n.ln}</span></button>`).join("")
      : `<div class="empty">No symbol or file matches "${esc(q.value.trim())}"</div>`;
    results.classList.add("open"); q.parentElement.setAttribute("aria-expanded", "true");
  }
  function pick(id) {
    q.value = ""; results.classList.remove("open"); q.blur();
    select(id);
  }
  function move(e, rows) {
    e.preventDefault();
    if (!rows.length) {
      return;
    }
    active = (active + (e.key === "ArrowDown" ? 1 : rows.length - 1)) % rows.length;
    rows.forEach((r, i) => r.setAttribute("aria-selected", String(i === active)));
    rows[active].scrollIntoView({ block: "nearest" });
  }
  q.addEventListener("input", search);
  q.addEventListener("keydown", (e) => {
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      move(e, [...results.querySelectorAll(".res")]);
    }
    if (e.key === "Enter" && hits[active]) {
      pick(hits[active].id);
    }
    if (e.key === "Escape") {
      q.value = ""; search(); q.blur();
    }
  });
  results.addEventListener("click", (e) => {
    const b = e.target.closest(".res");
    if (b) {
      pick(b.dataset.id);
    }
  });
  addEventListener("keydown", (e) => {
    if (document.activeElement === q) {
      return;
    }
    if (e.key === "/") {
      e.preventDefault(); q.focus(); q.select();
    }
    if (e.key === "Escape") {
      clear();
    }
  });

  $("zin").onclick = () => cam.animatedZoom({ duration: 300, easing: ease });
  $("zout").onclick = () => cam.animatedUnzoom({ duration: 300, easing: ease });
  $("zfit").onclick = () => cam.animatedReset({ duration: 500, easing: ease });
  applyTheme = () => {
    document.documentElement.dataset.theme = theme;
    buildPalette(); paintChips();
    renderer.setSetting("defaultEdgeColor", palette.edge);
    if (selected) {
      select(selected, false);
      return;
    }
    renderer.refresh();
  };
  applyTheme();

  // `#select=<id>` opens on a symbol, so a link can point straight at one. A malformed
  // escape like `%E0` throws; the map then settles as if there were no hash.
  let want = "";
  try {
    want = location.hash.startsWith("#select=") ? decodeURIComponent(location.hash.slice(8)) : "";
  } catch (_) {}
  if (want && graph.hasNode(want)) {
    select(want);
    return;
  }

  // The one authored moment: the map settles in from a wide view.
  cam.setState({ ratio: SETTLE_RATIO });
  requestAnimationFrame(() => cam.animate({ ratio: 1 }, { duration: SETTLE_MS, easing: ease }));
}

applyTheme();
$("theme").onclick = () => { theme = theme === "dark" ? "light" : "dark"; themePicked = true; applyTheme(); };
systemLight.addEventListener("change", (e) => {
  if (!themePicked) {
    theme = e.matches ? "light" : "dark";
    applyTheme();
  }
});
$("counts").textContent = `${fmt.format(DATA.nodes.length)} symbols · ${fmt.format(DATA.edges.length)} calls`;

if (!DATA.nodes.length) {
  $("statusText").innerHTML = "No symbols indexed yet.<small>Run <code>knot index</code> in the repo, then <code>knot viz</code> again.</small>";
  $("bar").hidden = true;
} else {
  $("statusText").textContent = `Laying out ${fmt.format(DATA.nodes.length)} symbols…`;
  // Labels are drawn on canvas, which does not wait for a web font on its own.
  layout((pos) => document.fonts.load(`600 12px ${LABEL_FONT}`).catch(() => {}).then(() => start(pos)));
}
</script>
</body>
</html>
